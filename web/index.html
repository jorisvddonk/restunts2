<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>restunts2 web</title>
    <style>
      html, body { height: 100%; margin: 0; background: #111; color: #eee;
                   font-family: sans-serif; }
      #menu { padding: 2em; max-width: 40em; }
      #menu a { color: #7df; }
      #menu small { color: #888; }
      #dos { width: 100%; height: 100%; display: none; }
      :root { --btn: min(22vw, 108px); }
      #pad { display: none; position: fixed; left: 0; right: 0; bottom: 0;
              padding: 0 16px 24px; justify-content: space-between;
              align-items: flex-end; pointer-events: none;
              touch-action: none; z-index: 10; }
      #pad.on { display: flex; }
      .cluster { display: grid; gap: 10px; pointer-events: auto; }
      #steer, #pedals { grid-template-columns: repeat(2, var(--btn));
                        grid-auto-rows: var(--btn); }
      .cluster button { font-size: calc(var(--btn) * 0.42);
                        border-radius: 18px; border: 2px solid #666;
                        background: rgba(30, 30, 30, 0.6); color: #eee;
                        touch-action: none; user-select: none;
                        -webkit-user-select: none;
                        -webkit-tap-highlight-color: transparent; }
      .cluster button.held { background: rgba(90, 150, 90, 0.8); }
    </style>
  </head>
  <body>
    <div id="menu">
      <h1>restunts2 web</h1>
      <p>Car: <select id="carsel"><option value="">Default</option></select></p>
      <p><label><input type="checkbox" id="autosave"> Auto-download replay files</label></p>
      <h2>Race a track</h2>
      <ul id="tracklist"><li><small>loading tracks…</small></li></ul>
      <h2>Watch a replay</h2>
      <ul id="replaylist"><li><small>loading replays…</small></li></ul>
      <ul>
        <li><a href="#" data-b="plain">Menus (no flags)</a>
          <small><code>REST2.EXE</code></small></li>
      </ul>
      <p>Driving: arrow keys / touch pad to steer/gas/brake. The buttons above
         boot straight into a race on the selected car/track (the in-game menu
         and track selection work too).</p>
    </div>
    <div id="dos"></div>
    <div id="pad">
      <div class="cluster" id="steer">
        <button data-k="37">◀</button>
        <button data-k="39">▶</button>
      </div>
      <div class="cluster" id="pedals">
        <button data-k="38">▲</button>
        <button data-k="13">⏎</button>
        <button data-k="40">▼</button>
        <button data-k="27">✕</button>
      </div>
    </div>
    <script src="js-dos.js"></script>
    <script>
      // Key codes are js-dos internal codes (Up 265, Down 264, Left 263,
      // Right 262, Enter 257, Esc 256). Buttons rewrite data-k on boot.
      const codes = { 37: 263, 39: 262, 38: 265, 40: 264, 13: 257, 27: 256 };
      let dosCI = null;
      function bindPad() {
        document.querySelectorAll("#pad button").forEach((b) => {
          const code = codes[b.dataset.k];
          const on = (e) => {
            e.preventDefault();
            b.classList.add("held");
            if (dosCI) dosCI.sendKeyEvent(code, true);
          };
          const off = (e) => {
            e.preventDefault();
            b.classList.remove("held");
            if (dosCI) dosCI.sendKeyEvent(code, false);
          };
          b.addEventListener("touchstart", on, { passive: false });
          b.addEventListener("touchend", off);
          b.addEventListener("touchcancel", off);
          b.addEventListener("mousedown", on);
          b.addEventListener("mouseup", off);
          b.addEventListener("mouseleave", off);
        });
      }
      // Driving pad layout for the built-in soft keyboard (sidebar icon).
      const touchPad = [
        [
          ["{up}"],
          ["{left} {right}"],
          ["{down}"],
          ["{enter} {esc}"],
        ],
      ];
      // ---- Replay autosave (JS-side) ----
      // The game auto-saves each finished race to lastrep.rpl. Poll the
      // emulator's DOS filesystem and download any .rpl that is new or whose
      // contents changed.
      const replHashes = new Map();
      let watcherTimer = null;
      let watcherSeeded = false;
      function findRpl(node, out, visited) {
        if (!node || typeof node !== "object" || visited.has(node)) return out;
        visited.add(node);
        if (Array.isArray(node)) {
          node.forEach((c) => findRpl(c, out, visited));
        } else if (Array.isArray(node.nodes)) {
          node.nodes.forEach((c) => findRpl(c, out, visited));
        } else if (node.name && /\.(rpl|rp2)$/i.test(node.name)) {
          out.push(node.name);
        }
        return out;
      }
      function hashBytes(a) {
        let h = 0;
        for (let i = 0; i < a.length; i++) h = (h * 31 + a[i]) >>> 0;
        return a.length + ":" + h;
      }
      // Enhanced replay (.rp2) = standard .rpl bytes + this 16-byte trailer.
      function parseRp2(bytes) {
        const n = bytes.length;
        if (n < 16) return null;
        const t = bytes.slice(n - 16);
        if (!(t[0] === 0x52 && t[1] === 0x50 && t[2] === 0x32 && t[3] === 0)) return null;
        const fps = t[5] || 20;
        const total = t[6] | (t[7] << 8);
        const penalty = t[8] | (t[9] << 8);
        const recorded = t[10] | (t[11] << 8);
        let sum = 0;
        for (let i = 0; i < 12; i++) sum = (sum + t[i]) & 0xffff;
        if ((t[12] | (t[13] << 8)) !== sum) return null;
        return { fps, total, penalty, recorded };
      }
      function fmtFrames(frames, fps) {
        if (!fps) fps = 20;
        const m = Math.floor(frames / (60 * fps));
        let rem = frames - m * 60 * fps;
        const s = Math.floor(rem / fps);
        rem -= s * fps;
        const cs = Math.floor((100 / fps) * rem);
        const p2 = (x) => String(x).padStart(2, "0");
        return m + ":" + p2(s) + "." + p2(cs);
      }
      function showToast(msg) {
        let el = document.getElementById("toast");
        if (!el) {
          el = document.createElement("div");
          el.id = "toast";
          el.style.cssText =
            "position:fixed;left:8px;bottom:8px;z-index:99;max-width:80vw;" +
            "background:#000c;color:#7df;font:13px/1.4 monospace;padding:6px 9px;" +
            "border:1px solid #7df;border-radius:4px;opacity:0;transition:opacity .25s";
          document.body.appendChild(el);
        }
        el.textContent = msg;
        el.style.opacity = "1";
        clearTimeout(el._t);
        el._t = setTimeout(() => {
          el.style.opacity = "0";
        }, 8000);
      }
      function downloadReplay(name, data) {
        const blob = new Blob([data], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = name.split("/").pop();
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        console.log("autosaved replay:", name, data.length, "bytes");
      }
      async function checkReplays() {
        if (!dosCI) return;
        try {
          const tree = await Promise.race([
            dosCI.fsTree(),
            new Promise((_, r) => setTimeout(() => r(new Error("timeout")), 5000)),
          ]);
          const rpls = findRpl(tree, [], new Set());
          for (const name of rpls) {
            let data;
            try {
              data = await dosCI.fsReadFile(name);
            } catch (err) {
              continue;
            }
            const h = hashBytes(data);
            const prev = replHashes.get(name);
            replHashes.set(name, h);
            // First poll: record the shipped replays without downloading.
            if (!watcherSeeded || prev === h) continue;
            if (document.getElementById("autosave")?.checked) {
              downloadReplay(name, data);
            }
            if (/\.rp2$/i.test(name)) {
              const info = parseRp2(data);
              if (info) {
                showToast(
                  "Race time " + fmtFrames(info.total - info.penalty, info.fps) +
                    "  |  penalty " + fmtFrames(info.penalty, info.fps) +
                    "  |  total " + fmtFrames(info.total, info.fps)
                );
                console.log("rp2 timing:", info);
              }
            }
          }
          watcherSeeded = true;
        } catch (err) {
          /* transient */
        }
      }
      function startReplayWatcher() {
        if (watcherTimer) return;
        setTimeout(checkReplays, 8000);
        watcherTimer = setInterval(checkReplays, 4000);
      }
      function attachBoot() {
        document.querySelectorAll("#menu a[data-b]").forEach((a) => {
          if (a.dataset.bound) return;
          a.dataset.bound = "1";
          a.onclick = (e) => {
            e.preventDefault();
            document.getElementById("menu").style.display = "none";
            document.getElementById("dos").style.display = "block";
            Dos(document.getElementById("dos"), {
              url: a.dataset.b + ".jsdos?v=43",
              pathPrefix: "emulators/",
              autoStart: true,
              softKeyboardLayout: touchPad,
              onEvent: (event, ci2) => {
                if (event === "ci-ready") {
                  dosCI = ci2;
                  startReplayWatcher();
                  if (matchMedia("(pointer: coarse)").matches) {
                    document.getElementById("pad").classList.add("on");
                    bindPad();
                  }
                }
              },
            });
          };
        });
      }
      // Populate the car selector and "Race a track" list. Bundles per track
      // and per track x car are generated by make-bundles.py.
      let TRACKS = [];
      function bundleForTrack(t) {
        const car = document.getElementById("carsel").value;
        return car
          ? "track-" + t.toLowerCase() + "-" + car.toLowerCase()
          : "track-" + t.toLowerCase();
      }
      function renderTracks() {
        const ul = document.getElementById("tracklist");
        const car = document.getElementById("carsel").value;
        ul.innerHTML = "";
        TRACKS.forEach((t) => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = "#";
          a.dataset.b = bundleForTrack(t);
          a.textContent = "Race on " + t;
          const s = document.createElement("small");
          s.textContent = " REST2.EXE /t" + t + (car ? " /c" + car : "");
          li.appendChild(a);
          li.appendChild(s);
          ul.appendChild(li);
        });
        attachBoot();
      }
      Promise.all([
        fetch("tracks.json").then((r) => r.json()),
        fetch("cars.json").then((r) => r.json()),
        fetch("replays.json").then((r) => r.json()),
      ])
        .then(([tracks, cars, replays]) => {
          TRACKS = tracks;
          const sel = document.getElementById("carsel");
          cars.forEach((c) => {
            const o = document.createElement("option");
            o.value = c;
            o.textContent = c;
            sel.appendChild(o);
          });
          sel.value = cars.includes("PMIN") ? "PMIN" : ""; // default car
          sel.addEventListener("change", renderTracks);
          renderTracks();

          const rl = document.getElementById("replaylist");
          rl.innerHTML = "";
          replays.forEach((r) => {
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = "#";
            a.dataset.b = "replay-" + r.toLowerCase();
            a.textContent = "Watch " + r;
            const s = document.createElement("small");
            s.textContent = " REST2.EXE " + r;
            li.appendChild(a);
            li.appendChild(s);
            rl.appendChild(li);
          });
          attachBoot();
        })
        .catch(() => {
          document.getElementById("tracklist").innerHTML =
            "<li><small>no tracks.json (run make-bundles.py)</small></li>";
        });
      attachBoot();
    </script>
  </body>
</html>
